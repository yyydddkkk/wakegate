[project]
name = "wakegate"
version = "0.2.0"
description = "A framework-agnostic gate that decides whether an event should wake your AI agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "mcp>=2,<3",
]

[project.scripts]
wakegate = "wakegate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
